name: Refresh official sources
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.ilang/site.ilang'
      - 'scraper.py'
      - 'build.py'
      - 'verify.py'
      - 'templates/**'
      - 'config.py'
jobs:
  refresh:
    if: ${{ github.event_name != 'push' || (!contains(github.event.head_commit.message, '[sitemap-only]') && !contains(github.event.head_commit.message, '[provider-only]')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public sources
        run: python scraper.py
      - name: Render static site
        run: python build.py
      - name: Verify generated pages
        run: python verify.py
      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json site/
          if ! git diff --cached --quiet; then
            git commit -m "Update verified VPS sources"
            git push
          fi
